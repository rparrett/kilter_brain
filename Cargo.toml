[package]
name = "kilter_brain"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["mobile"]

[features]
debug = ["dep:bevy-inspector-egui"]

[dependencies]
bevy-inspector-egui = { version = "0.31", optional = true, default-features = false, features = [
    "bevy_pbr",
    "bevy_image",
    "bevy_render",
    "bevy_core_pipeline",
    "egui_clipboard",
] }
bevy = "0.16"
bevy_http_client = "0.8"
bevy_simple_text_input = "0.11"
bevy_simple_prefs = "0.6.2"
combine = "4.6.6"
indexmap = "2.2.6"
serde = "1.0.196"
serde_derive = "1.0.196"
serde_json = "1.0.113"
uuid = "*"
webbrowser = "1.0.1"
names = { version = "0.14.0", default-features = false }

# Disable low-severity logs at compile time for performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
rand = "0.8"
dirs = "6.0.0"

[target.'cfg(not(any(target_arch = "wasm32")))'.dependencies]
clipboard = "0.5.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "*", features = [
    "Element",
    "Document",
    "Window",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
] }
wasm-bindgen = "*"
gloo-events = "0.1"
futures = "0.3"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[profile.web-dist]
inherits = "dist"
opt-level = "s"
